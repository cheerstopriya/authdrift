name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Connected isolated editable installation
        run: python -m pip install -e .
      - run: python -m pip check
      - run: authdrift --help
      - run: python -m unittest discover -s tests -v
      - run: authdrift run examples/refund/safe.py --repeats 20
      - run: python benchmarks/run.py
      - name: Verify showcase controls and collect synthetic evidence
        run: python benchmarks/showcase.py --output results/showcase
      - name: Retain fixture evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fixture-evidence-${{ matrix.os }}-${{ matrix.python }}
          path: results/showcase/
          if-no-files-found: warn
