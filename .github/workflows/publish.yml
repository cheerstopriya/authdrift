name: Build and optionally publish

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Upload validated artifacts to PyPI (requires release approval)'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build twine
      - name: Build sdist and wheel
        run: python -m build
      - name: Validate package metadata
        run: python -m twine check --strict dist/*
      - name: Test installed wheel outside source tree
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/wheel-test"
          "$RUNNER_TEMP/wheel-test/bin/python" -m pip install --no-index --no-deps dist/*.whl
          mkdir -p "$RUNNER_TEMP/installed-tests"
          cp -r tests examples benchmarks "$RUNNER_TEMP/installed-tests/"
          cd "$RUNNER_TEMP/installed-tests"
          "$RUNNER_TEMP/wheel-test/bin/python" -m pip check
          "$RUNNER_TEMP/wheel-test/bin/python" -I -c 'import authdrift; from importlib.metadata import version; assert version("authdrift-harness") == "0.1.0"; print(authdrift.__file__)'
          "$RUNNER_TEMP/wheel-test/bin/authdrift" --help
          "$RUNNER_TEMP/wheel-test/bin/python" -m unittest discover -s tests -v
          "$RUNNER_TEMP/wheel-test/bin/python" benchmarks/run.py
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  publish:
    if: inputs.publish && github.ref == 'refs/tags/v0.1.0'
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
