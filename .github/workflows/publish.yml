name: Verify and optionally publish audited v0.1.0
on:
  workflow_dispatch:
    inputs:
      release_id:
        description: 'Numeric ID of the approved draft release containing audited assets'
        required: true
        type: string
      publish:
        description: 'Publish verified bytes to PyPI (requires explicit approval)'
        required: true
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Retrieve identified assets and verify source and hashes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ inputs.release_id }}
        run: python .github/scripts/verify_release.py fetch dist
      - uses: actions/upload-artifact@v4
        with:
          name: verified-v0.1.0-distributions
          path: dist/
          if-no-files-found: error
  publish:
    if: inputs.publish && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: verified-v0.1.0-distributions
          path: dist/
      - name: Recheck bytes and live release tag before upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/verify_release.py prepublish dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
