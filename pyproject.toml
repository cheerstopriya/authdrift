[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "authdrift"
version = "0.1.0"
description = "A developer testing harness for confirmed authority changes in agent workflows"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
]

[project.scripts]
authdrift = "authdrift.cli.main:main"

[project.urls]
Repository = "https://github.com/cheerstopriya/authdrift"
Issues = "https://github.com/cheerstopriya/authdrift/issues"
Documentation = "https://github.com/cheerstopriya/authdrift#readme"
Security = "https://github.com/cheerstopriya/authdrift/security/advisories/new"

[tool.setuptools.packages.find]
include = ["authdrift*"]
